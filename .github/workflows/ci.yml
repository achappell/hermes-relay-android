name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_BUILD_TOOLS: 36.0.0
  # Android 17 is published as the API 37.0 preview platform package.
  ANDROID_COMPILE_PLATFORM: "37.0"

jobs:
  validate:
    name: Build, test, lint, and inspect APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=1 \
            "platforms;android-${ANDROID_COMPILE_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Run JVM tests, assemble, and lint
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon

      - name: Verify APK metadata
        run: scripts/check-apk-metadata.sh

      - name: Check repository diff
        run: git diff --check

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-relay-android-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Instrumentation tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: "36"
            channel: stable
            label: Android 16 / API 36
          - api-level: "37.0"
            channel: beta
            label: Android 17 / API 37

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=1 \
            "platforms;android-${ANDROID_COMPILE_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Run connected Android tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          channel: ${{ matrix.channel }}
          profile: Pixel_2
          target: google_apis
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-relay-android-instrumentation-${{ matrix.api-level }}-${{ github.sha }}
          path: app/build/outputs/androidTest-results
          if-no-files-found: warn
          retention-days: 14
