name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_BUILD_TOOLS: 36.0.0
  # Android 17 is published as the API 37.0 preview platform package.
  ANDROID_COMPILE_PLATFORM: "37.0"

jobs:
  issue-tracking:
    name: Validate BMAD issue tracking
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Test issue-tracking helpers and workflow wiring
        run: python -m unittest discover -s tests -p 'test_bmad_issue_tracking*.py'

      - name: Check override sources and shell syntax
        run: |
          bash -n scripts/apply_repo_issue_tracking_overrides.sh
          scripts/apply_repo_issue_tracking_overrides.sh --check

  validate:
    name: Build, test, lint, and inspect APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=1 \
            "platforms;android-${ANDROID_COMPILE_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Run JVM tests, assemble, and lint
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon

      - name: Verify APK metadata
        run: scripts/check-apk-metadata.sh

      - name: Test the 16 KB page-size check
        run: python3 -m unittest discover -s tests -p 'test_check_elf_alignment.py'

      # ANDROID-REL-03: the release variant is minified; a missing R8 keep rule
      # or a misaligned native library must fail the pull request, not the tag.
      # Without release secrets this signs with the debug key (never published).
      - name: Build and verify the minified release APK
        run: |
          ./gradlew assembleRelease lintRelease --no-daemon
          scripts/check-apk-metadata.sh app/build/outputs/apk/release/app-release.apk
          # DiagnosticsJournal records OkHttp exception simple names, so R8 must
          # not rename them; and R8 must not report classes it lacks rules for.
          grep -qx 'okhttp3.internal.http2.StreamResetException -> okhttp3.internal.http2.StreamResetException:' \
            app/build/outputs/mapping/release/mapping.txt
          if [[ -s app/build/outputs/mapping/release/missing_rules.txt ]]; then
            cat app/build/outputs/mapping/release/missing_rules.txt
            exit 1
          fi

      - name: Check repository diff
        run: git diff --check

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-relay-android-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
