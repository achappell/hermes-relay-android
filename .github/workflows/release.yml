name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to package (for example, v0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag to package"
        required: true
        type: string

permissions:
  contents: read

env:
  ANDROID_BUILD_TOOLS: 36.0.0
  # Android 17 is published as the API 37.0 preview platform package.
  ANDROID_COMPILE_PLATFORM: "37.0"

jobs:
  package:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=1 \
            "platforms;android-${ANDROID_COMPILE_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Verify release version
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          version_name="$(sed -n 's/.*appVersionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          if [[ -z "$version_name" ]]; then
            printf '%s\n' "Could not read appVersionName from app/build.gradle.kts." >&2
            exit 1
          fi
          test "$version" = "$version_name"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_KEYSTORE_BASE64}" ]]; then
            printf '%s\n' "RELEASE_KEYSTORE_BASE64 secret is not set." >&2
            exit 1
          fi
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"

      - name: Test and build release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease lintRelease --no-daemon

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"

      - name: Package and checksum release APK
        env:
          # Optional: set the RELEASE_SIGNER_SHA256 repository variable to pin
          # the expected signing certificate. Unset, the signature is still
          # produced but not asserted against a known key.
          EXPECTED_SIGNER_SHA256: ${{ vars.RELEASE_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          scripts/check-apk-metadata.sh "$apk"
          mkdir -p dist
          cp "$apk" "dist/hermes-relay-android-${version}.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Ensure the GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --notes "Android APK for API 26+ (compiled and targeted with Android API 37), signed with the project developer key for sideloading. Not a Play Store build."

      - name: Upload release APK and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
